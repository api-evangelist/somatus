aid: somatus
name: Somatus
description: 'Somatus is a value-based kidney and heart care management company founded
  in 2016 and headquartered in McLean, Virginia. It partners with health plans, provider
  groups and nephrology practices to slow the progression of chronic kidney disease
  (CKD), end-stage kidney disease (ESKD) and congestive heart failure, surrounding
  patients with in-home and virtual care teams of nurses, community health workers,
  pharmacists, dietitians and social workers across all 50 states and DC. Its proprietary
  RenalIQ technology platform applies predictive analytics and machine learning across
  claims, clinical and social data to prioritize interventions, and is surfaced to
  partners through a patient portal and a provider/health-plan self-service portal.
  Somatus is HITRUST CSF certified and holds NCQA accreditations for Case Management,
  Population Health and Health Equity. Somatus publishes no public developer program,
  API documentation or machine-readable API contract; RenalIQ is delivered as a partner
  portal rather than a public API.'
